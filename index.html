<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মেস ব্যবস্থাপনা খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a2118; --ink-soft:#5a4d3c;
    --paper:#f1ead9; --paper-deep:#e8dfc9; --paper-line:#cabf9e;
    --cover:#7a2e2e; --cover-dark:#54201f;
    --gold:#a9822f;
    --ledger-blue:#374a63; --ledger-blue-deep:#2a3a4f;
    --good:#3f6b4a; --bad:#a5402f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hind Siliguri',sans-serif;color:var(--ink);background:var(--paper-deep);min-height:100vh;}
  h1,h2,h3,.serif{font-family:'Tiro Bangla',serif;font-weight:400;}
  header{background:var(--cover);color:#f1ead9;padding:20px 20px 24px;border-bottom:4px solid var(--gold);}
  header h1{margin:0;font-size:1.5rem;}
  header p{margin:4px 0 0;font-size:.82rem;color:#d9c9a8;}
  .setup-warn{background:#3a1414;color:#f3d9c9;padding:10px 16px;font-size:.85rem;border-bottom:2px solid var(--gold);}
  .setup-warn code{background:rgba(255,255,255,.12);padding:2px 6px;border-radius:3px;}
  nav.tabs{display:flex;gap:4px;padding:0 10px;background:var(--cover-dark);overflow-x:auto;}
  nav.tabs button{font-family:'Hind Siliguri',sans-serif;font-size:.9rem;border:none;cursor:pointer;padding:11px 16px 10px;background:transparent;color:#e6d9bc;border-radius:8px 8px 0 0;white-space:nowrap;}
  nav.tabs button.active{background:var(--paper);color:var(--cover-dark);font-weight:600;}
  nav.tabs button:not(.active):hover{background:rgba(255,255,255,.08);}
  main{max-width:1100px;margin:0 auto;padding:22px 14px 60px;}
  .sheet{background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent,transparent 37px,var(--paper-line) 38px);border-top:3px solid var(--gold);box-shadow:0 8px 22px rgba(42,33,24,.18);padding:20px 18px 8px;border-radius:0 6px 6px 6px;}
  .sheet-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .sheet-title h2{margin:0;font-size:1.3rem;color:var(--cover-dark);}
  .muted{color:var(--ink-soft);font-size:.85rem;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
  .tile{background:var(--paper);border-left:5px solid var(--gold);padding:12px 12px 10px;box-shadow:0 2px 6px rgba(42,33,24,.12);}
  .tile.blue{border-left-color:var(--ledger-blue);} .tile.good{border-left-color:var(--good);}
  .tile .num{font-family:'Tiro Bangla',serif;font-size:1.7rem;line-height:1;display:block;}
  .tile .label{font-size:.78rem;color:var(--ink-soft);margin-top:6px;display:block;}
  .toggle-btn{background:var(--ledger-blue);color:#fff;border:none;padding:10px 20px;border-radius:3px;cursor:pointer;font-size:.9rem;margin-bottom:16px;font-family:'Hind Siliguri',sans-serif;}
  .toggle-btn:hover{background:var(--ledger-blue-deep);}
  .toggle-btn.open{background:var(--cover-dark);}
  form.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 16px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);margin-bottom:18px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:.8rem;color:var(--ink-soft);}
  .field input,.field select,.field textarea{font-family:'Hind Siliguri',sans-serif;font-size:1rem;background:transparent;border:none;border-bottom:2px solid var(--paper-line);padding:6px 2px;color:var(--ink);outline:none;}
  .field textarea{resize:vertical;min-height:40px;}
  .field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:var(--gold);}
  .field img.avatar-preview{width:52px;height:52px;border-radius:50%;object-fit:cover;margin-top:4px;border:1px solid var(--paper-line);}
  .form-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;}
  button.primary{font-family:'Hind Siliguri',sans-serif;background:var(--cover);color:#f1ead9;border:none;padding:10px 22px;font-size:.95rem;cursor:pointer;border-radius:3px;}
  button.primary:hover{background:var(--cover-dark);}
  button.ghost{font-family:'Hind Siliguri',sans-serif;background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);padding:9px 16px;font-size:.9rem;cursor:pointer;border-radius:3px;}
  .search-box input{width:100%;max-width:280px;font-family:'Hind Siliguri',sans-serif;font-size:.92rem;background:transparent;border:none;border-bottom:2px solid var(--paper-line);padding:6px 2px;outline:none;margin-bottom:14px;}
  .table-wrap{overflow-x:auto;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px;}
  thead th{background:var(--ledger-blue);color:#f1ead9;text-align:left;padding:8px 9px;font-weight:600;font-size:.8rem;}
  tbody td{padding:8px 9px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  tbody tr:nth-child(even){background:rgba(0,0,0,.02);}
  td.serial,.amount{font-family:'Tiro Bangla',serif;}
  td.serial{color:var(--gold);font-weight:600;width:1%;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .row-actions button{background:none;border:none;cursor:pointer;color:var(--ledger-blue);font-size:.82rem;text-decoration:underline;padding:0;font-family:'Hind Siliguri',sans-serif;}
  .row-actions button.del{color:var(--bad);}
  .badge{display:inline-block;padding:2px 9px;font-size:.76rem;border:1px solid currentColor;border-radius:12px;}
  .badge.student{color:var(--ledger-blue);} .badge.teacher{color:var(--good);} .badge.member{color:var(--gold);}
  .empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:.9rem;}
  .recent-list{list-style:none;padding:0;margin:0 0 20px;}
  .recent-list li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--paper-line);font-size:.9rem;}
  .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--paper-line);vertical-align:middle;}
  .avatar-ph{width:30px;height:30px;border-radius:50%;background:var(--ledger-blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;vertical-align:middle;}
  .meal-input{width:56px;}
  .report-type-toggle{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .report-type-toggle button{padding:8px 16px;border:1px solid var(--paper-line);background:transparent;cursor:pointer;border-radius:3px;font-family:'Hind Siliguri',sans-serif;}
  .report-type-toggle button.active{background:var(--cover);color:#fff;border-color:var(--cover);}
  .card-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .card-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.02);border-left:4px solid var(--gold);flex-wrap:wrap;gap:8px;}
  .card-item .actions{display:flex;gap:12px;}
  .member-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .member-header img,.member-header .avatar-ph{width:44px;height:44px;font-size:1rem;}
  .print-note{font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;}
  #printArea{display:none;}
  .fee-input{width:90px;}
  .official-print h2{margin:0 0 4px;}
  .official-print .stmt-meta{font-size:.85rem;margin-bottom:14px;}
  .official-print table{width:100%;border-collapse:collapse;}
  .official-print th,.official-print td{border:1px solid #000;padding:6px 8px;font-size:.9rem;}
  .official-print .sig-row{display:flex;justify-content:space-between;margin-top:50px;font-size:.85rem;}
  .official-print .sig-row div{border-top:1px solid #000;padding-top:6px;width:160px;text-align:center;}
  @media print{
    body{background:#fff !important;}
    body *{visibility:hidden;}
    #printArea,#printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:10px;background:#fff !important;}
    #printArea, #printArea *{
      background:transparent !important;
      background-image:none !important;
      box-shadow:none !important;
      color:#000 !important;
      border-color:#000 !important;
    }
    #printArea table, #printArea th, #printArea td{border:1px solid #000 !important;}
  }
  @media (max-width:480px){ header h1{font-size:1.25rem;} .sheet{padding:15px 10px 6px;} }
</style>
</head>
<body>

<header>
  <h1 class="serif">মেস ব্যবস্থাপনা খাতা</h1>
  <p>সদস্য, জমা ও মিলের হিসাব একসাথে</p>
</header>
<div class="setup-warn" id="setupWarn" style="display:none;">
  ⚠ প্রথমে সেটআপ শেষ করুন: এই ফাইলের নিচের দিকে <code>CONFIG.API_URL</code> এ আপনার Google Apps Script Web App লিংক বসান। বিস্তারিত নির্দেশনা ফাইলের শেষে কমেন্টে দেওয়া আছে।
</div>

<nav class="tabs">
  <button data-tab="dashboard" class="active">ড্যাশবোর্ড</button>
  <button data-tab="members">সদস্য</button>
  <button data-tab="deposits">জমা</button>
  <button data-tab="fees">ফি নির্ধারণ</button>
  <button data-tab="meals">মিল এন্ট্রি</button>
  <button data-tab="dailylist">দৈনিক মেনু তালিকা</button>
  <button data-tab="report">রিপোর্ট</button>
</nav>

<main>
  <div class="sheet" id="sheet"></div>
</main>

<div id="printArea"></div>

<script>
/* ======================= কনফিগারেশন ======================= */
const CONFIG = {
  // এখানে আপনার Google Apps Script Web App ডিপ্লয়মেন্ট URL বসান (Code.gs ডিপ্লয় করার পর যেটা পাবেন)
  API_URL: "https://script.google.com/macros/s/AKfycbwH1JV9mwgcrUpNs8t1mHZscHGNS2-v_AfwYw-EXBJWLozlVRHNOjU1IfwblvtmjEg/exec"   // উদাহরণ: "https://script.google.com/macros/s/AKfycb.../exec"
};

/* ======================= হেল্পার ======================= */
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBn(n){ return String(n).replace(/[0-9]/g, d => BN_DIGITS[+d]); }
function fmtMoney(n){ n = Number(n)||0; return '৳' + toBn(n.toLocaleString('en-IN')); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return toBn(d.getDate())+'/'+toBn(d.getMonth()+1)+'/'+toBn(d.getFullYear());
}
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysInMonth(m,y){ return new Date(y, m+1, 0).getDate(); }
function avatarHtml(member, size){
  size = size || 30;
  if(member && member.ছবি){ return `<img src="${member.ছবি}" class="avatar" style="width:${size}px;height:${size}px;">`; }
  const initial = member && member.নাম ? member.নাম.charAt(0) : '?';
  return `<span class="avatar-ph" style="width:${size}px;height:${size}px;">${initial}</span>`;
}
function typeBadge(type){
  const cls = type==='ছাত্র'?'student':(type==='শিক্ষক'?'teacher':'member');
  return `<span class="badge ${cls}">${type}</span>`;
}
function resizeImageToDataUrl(file, maxDim){
  maxDim = maxDim || 120;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = h*maxDim/w; w = maxDim; } }
        else { if(h > maxDim){ w = w*maxDim/h; h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function doPrint(html){
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

/* ======================= API ======================= */
async function apiGet(params){
  const url = CONFIG.API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(CONFIG.API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ======================= স্টেট ======================= */
let members = [], deposits = [], mealEntries = [];
let menuItems = [], dailyMenus = [];
let feeSettings = [], monthlyExpenses = [];
let currentTab = 'dashboard';
let editingMemberId=null, editingDepositId=null, editingMealDate=null, editingMenuId=null, editingFeeId=null, editingExpenseId=null;
let showMemberForm=false, showDepositForm=false, showMealForm=false, showDailyForm=false, showReportForm=true, showMenuForm=false, showFeeForm=false, showExpenseForm=false;
let memberSearch='';
let dailyLists = []; // { id, month, year } — সেশনে তৈরি করা দৈনিক মেনু তালিকার তালিকা
let reportType = 'member';
let pendingMemberPhoto = null;
let pendingMenuPhoto = null;
const FEE_CATS = [
  {key:'ভাড়া', label:'ভাড়া'},
  {key:'গ্যাস_বিল', label:'গ্যাস বিল'},
  {key:'বিদ্যুৎ_বিল', label:'বিদ্যুৎ বিল'},
  {key:'ময়লা_বিল', label:'ময়লা বিল'},
  {key:'আসবাবপত্র_বিল', label:'আসবাবপত্র বিল'},
  {key:'বাবুর্চি_বিল', label:'বাবুর্চি বিল'},
  {key:'খাবার_বিল', label:'খাবার বিল'}
];

async function loadAll(){
  if(!CONFIG.API_URL){
    document.getElementById('setupWarn').style.display='block';
    render();
    return;
  }
  try{
    const data = await apiGet({action:'getAll'});
    members = data.members || [];
    deposits = data.deposits || [];
    mealEntries = data.meals || [];
    menuItems = data.menuItems || [];
    dailyMenus = data.dailyMenus || [];
    feeSettings = data.feeSettings || [];
    monthlyExpenses = data.monthlyExpenses || [];
  }catch(err){
    alert('তথ্য লোড করতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ ও API লিংক পরীক্ষা করুন।\n' + err.message);
  }
  render();
}

/* ======================= ট্যাব ======================= */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    editingMemberId=null; editingDepositId=null; editingMealDate=null; editingMenuId=null; editingFeeId=null; editingExpenseId=null;
    render();
  });
});

function render(){
  if(currentTab==='dashboard') renderDashboard();
  else if(currentTab==='members') renderMembers();
  else if(currentTab==='deposits') renderDeposits();
  else if(currentTab==='fees') renderFees();
  else if(currentTab==='meals') renderMeals();
  else if(currentTab==='dailylist') renderDailyList();
  else renderReport();
}

/* ======================= ড্যাশবোর্ড ======================= */
function renderDashboard(){
  const sheet = document.getElementById('sheet');
  const now = new Date();
  const totalMembers = members.length;
  const students = members.filter(m=>m.ধরন==='ছাত্র').length;
  const teachers = members.filter(m=>m.ধরন==='শিক্ষক').length;
  const thisMonthDeposit = deposits
    .filter(d=> Number(d.ভাড়ার_মাস)===now.getMonth() && Number(d.ভাড়ার_বছর)===now.getFullYear())
    .reduce((s,d)=> s + (Number(d.ভাড়ার_পরিমাণ)||0) + (Number(d.ভর্তি_ফি)||0), 0);
  const grandTotal = deposits.reduce((s,d)=> s + (Number(d.ভর্তি_ফি)||0) + (Number(d.ভাড়ার_পরিমাণ)||0), 0);
  const thisMonthMeals = mealEntries.filter(e=>{
    const d = new Date(e.date+'T00:00:00'); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).reduce((s,e)=> s + Object.values(e.meals||{}).reduce((s2,m)=> s2+(Number(m['মোট'])||0),0), 0);

  const recent = [...deposits].sort((a,b)=>(b.তারিখ||'').localeCompare(a.তারিখ||'')).slice(0,5);

  sheet.innerHTML = `
    <div class="sheet-title"><h2 class="serif">সারসংক্ষেপ</h2><span class="muted">${BN_MONTHS[now.getMonth()]} ${toBn(now.getFullYear())}</span></div>
    <div class="tiles">
      <div class="tile"><span class="num">${toBn(totalMembers)}</span><span class="label">মোট সদস্য</span></div>
      <div class="tile blue"><span class="num">${toBn(students)}</span><span class="label">ছাত্র</span></div>
      <div class="tile blue"><span class="num">${toBn(teachers)}</span><span class="label">শিক্ষক</span></div>
      <div class="tile good"><span class="num">${fmtMoney(thisMonthDeposit)}</span><span class="label">এই মাসের আদায়</span></div>
      <div class="tile"><span class="num">${fmtMoney(grandTotal)}</span><span class="label">সর্বমোট আদায়</span></div>
      <div class="tile blue"><span class="num">${toBn(thisMonthMeals)}</span><span class="label">এই মাসের মোট মিল</span></div>
    </div>
    <h3 class="serif" style="margin-bottom:8px;">সাম্প্রতিক জমা</h3>
    ${recent.length ? `<ul class="recent-list">${recent.map(d=>{
      const mem = members.find(m=>m.ID===d.সদস্য_আইডি);
      const total = (Number(d.ভর্তি_ফি)||0)+(Number(d.ভাড়ার_পরিমাণ)||0);
      return `<li><span>${mem?mem.নাম:'অজানা'} <div class="muted">${BN_MONTHS[d.ভাড়ার_মাস]} ${toBn(d.ভাড়ার_বছর)} · ${fmtDate(d.তারিখ)}</div></span><span class="amount serif">${fmtMoney(total)}</span></li>`;
    }).join('')}</ul>` : `<div class="empty">এখনো কোনো জমা রেকর্ড নেই।</div>`}
  `;
}

/* ======================= সদস্য ======================= */
function renderMembers(){
  const sheet = document.getElementById('sheet');
  const editing = editingMemberId ? members.find(m=>m.ID===editingMemberId) : null;

  sheet.innerHTML = `
    <div class="sheet-title"><h2 class="serif">সদস্য</h2><span class="muted">মোট ${toBn(members.length)} জন</span></div>
    <button class="toggle-btn ${showMemberForm?'open':''}" id="btnToggleMemberForm">${showMemberForm ? 'ফরম বন্ধ করুন' : (editing ? 'সম্পাদনা ফরম খুলুন' : '+ নতুন সদস্য যুক্ত করুন')}</button>
    <div id="memberFormWrap"></div>
    <div class="search-box"><input type="text" id="memberSearchInput" placeholder="নাম বা মোবাইল দিয়ে খুঁজুন..." value="${memberSearch}"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ক্রম</th><th>ছবি</th><th>নাম</th><th>মোবাইল</th><th>ধরন</th><th>ক্লাস</th><th>তারিখ</th><th>ঠিকানা</th><th></th></tr></thead>
        <tbody id="memberRows"></tbody>
      </table>
    </div>
  `;

  document.getElementById('btnToggleMemberForm').addEventListener('click', ()=>{
    showMemberForm = !showMemberForm;
    if(!showMemberForm) editingMemberId = null;
    renderMembers();
  });

function renderMemberRows(){

  const filtered = members.filter(m=> !q || m.নাম.toLowerCase().includes(q) || String(m.মোবাইল).includes(q));
  if(!filtered.length){ tbody.innerHTML = `<tr><td colspan="9"><div class="empty">কোনো সদস্য পাওয়া যায়নি।</div></td></tr>`; return; }

    const serial = members.findIndex(x=>x.ID===m.ID)+1;
    return `<tr>
      <td class="serial">${toBn(serial)}</td>
      <td>${avatarHtml(m)}</td>

      return `<tr><td>${m.নাম}</td><td>${toBn(v['সকাল']||0)}</td><td>${toBn(v['দুপুর']||0)}</td><td>${toBn(v['রাত']||0)}</td><td>${toBn(v['মোট']||0)}</td></tr>`;

let gridState = {};

function showDailyGrid(month, year){
  const dim = daysInMonth(month, year);
  gridState = {};
  let body = '';
  for(let day=1; day<=dim; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const row = dailyMenus.find(d=>d.তারিখ===iso) || {};
    gridState[iso] = { 'সকাল': row['সকাল']||'', 'দুপুর': row['দুপুর']||'', 'রাত': row['রাত']||'' };
    const mealCell = (mealType)=>{
      const current = gridState[iso][mealType];
      return `<td>
        <select class="menu-select" data-date="${iso}" data-meal="${mealType}">
          <option value="">— নির্বাচন করুন —</option>
          ${menuItems.map(mi=>`<option value="${mi.ID}" ${current===mi.ID?'selected':''}>${mi.নাম}</option>`).join('')}
        </select>
        <div id="mp-${iso}-${mealType}">${menuPhotoHtml(current)}</div>
      </td>`;
    };
    body += `<tr><td>${toBn(day)}</td>${mealCell('সকাল')}${mealCell('দুপুর')}${mealCell('রাত')}</tr>`;
  }
  const html = `
    <h3 class="serif">${BN_MONTHS[month]} ${toBn(year)} — দৈনিক মেনু তালিকা</h3>
    <p class="print-note">প্রতিটি বক্সে খাবার নির্বাচন করলে সাথে সাথে সংরক্ষণ হয়ে যাবে। প্রিন্ট করতে চাইলে উপরের তালিকায় "প্রিন্ট" বাটন ব্যবহার করুন।</p>
    <div class="table-wrap"><table>
      <thead><tr><th>তারিখ</th><th>সকাল</th><th>দুপুর</th><th>রাত</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
  `;
  const area = document.getElementById('dailyGridArea');
  area.innerHTML = html;
  area.querySelectorAll('.menu-select').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const date = e.target.dataset.date, meal = e.target.dataset.meal, val = e.target.value;
      gridState[date][meal] = val;
      document.getElementById(`mp-${date}-${meal}`).innerHTML = menuPhotoHtml(val);
      await apiPost({action:'saveDailyMenu', date, values: gridState[date]});
      const idx = dailyMenus.findIndex(d=>d.তারিখ===date);
      const newRow = { তারিখ: date, ...gridState[date] };
      if(idx>-1) dailyMenus[idx]=newRow; else dailyMenus.push(newRow);
    });
  });
}

function printDailyGrid(month, year){
  const dim = daysInMonth(month, year);
  let body = '';
  for(let day=1; day<=dim; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const row = dailyMenus.find(d=>d.তারিখ===iso) || {};
    const cell = (mealType)=>{
      const mi = menuItems.find(x=>x.ID===row[mealType]);
      if(!mi) return '—';
      return `${mi.ছবি?`<img src="${mi.ছবি}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;display:block;margin:0 auto 4px;">`:''}${mi.নাম}`;
    };
    body += `<tr><td>${toBn(day)}</td><td style="text-align:center;">${cell('সকাল')}</td><td style="text-align:center;">${cell('দুপুর')}</td><td style="text-align:center;">${cell('রাত')}</td></tr>`;
  }
  doPrint(`<h2>${BN_MONTHS[month]} ${toBn(year)} — দৈনিক মেনু তালিকা</h2>
    <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;">
      <tr><th>তারিখ</th><th>সকাল</th><th>দুপুর</th><th>রাত</th></tr>${body}
    </table>`);
}

/* ======================= রিপোর্ট ======================= */
function renderReport(){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-title"><h2 class="serif">রিপোর্ট</h2></div>
    <button class="toggle-btn ${showReportForm?'open':''}" id="btnToggleReportForm">${showReportForm?'ফরম বন্ধ করুন':'+ রিপোর্ট তৈরি করুন'}</button>
    <div id="reportFormWrap"></div>
    <div id="reportResult"></div>
  `;
  document.getElementById('btnToggleReportForm').addEventListener('click', ()=>{ showReportForm=!showReportForm; renderReport(); });

  if(showReportForm){
    const wrap = document.getElementById('reportFormWrap');
    wrap.innerHTML = `
      <div class="report-type-toggle">
        <button type="button" class="${reportType==='member'?'active':''}" id="rtMember">সদস্য ভিত্তিক</button>
        <button type="button" class="${reportType==='all'?'active':''}" id="rtAll">সকল</button>
      </div>
      <form class="entry" id="reportForm">
        ${reportType==='member' ? `<div class="field full"><label>সদস্য</label>
          <select name="memberId">${members.map(m=>`<option value="${m.ID}">${m.নাম}</option>`).join('')}</select>
        </div>` : ''}
        <div class="field"><label>হিসাবের তারিখ পর্যন্ত</label><input type="date" name="asOf" value="${todayIso()}"></div>
        <div class="form-actions"><button type="submit" class="primary">রিপোর্ট তৈরি করুন</button></div>
      </form>
    `;
    document.getElementById('rtMember').addEventListener('click', ()=>{ reportType='member'; renderReport(); });
    document.getElementById('rtAll').addEventListener('click', ()=>{ reportType='all'; renderReport(); });
    document.getElementById('reportForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const asOf = fd.get('asOf') || todayIso();
      if(reportType==='member') buildMemberReport(fd.get('memberId'), asOf);
      else buildAllReport(asOf);
    });
  }
}

function memberMealTotals(name, month, year){
  const dim = daysInMonth(month, year);
  let b=0,l=0,d=0,t=0;
  for(let day=1; day<=dim; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const entry = mealEntries.find(e=>e.date===iso);
    if(entry && entry.meals[name]){
      b += Number(entry.meals[name]['সকাল'])||0;
      l += Number(entry.meals[name]['দুপুর'])||0;
      d += Number(entry.meals[name]['রাত'])||0;
      t += Number(entry.meals[name]['মোট'])||0;
    }
  }
  return {b,l,d,t};
}

function allMembersMealsTotal(month, year){
  return members.reduce((s,m)=> s + memberMealTotals(m.নাম, month, year).t, 0);
}

function monthlyExpenseFor(month, year){
  const e = monthlyExpenses.find(x=> Number(x.মাস)===month && Number(x.বছর)===year);
  return e ? Number(e.মোট_খরচ)||0 : 0;
}

function getApplicableFee(memberId, month, year){
  const cutoff = new Date(year, month+1, 0); // ঐ মাসের শেষ দিন
  const candidates = feeSettings.filter(f=> f.সদস্য_আইডি===memberId && f.তারিখ && new Date(f.তারিখ+'T00:00:00') <= cutoff);
  if(!candidates.length) return null;
  candidates.sort((a,b)=> a.তারিখ.localeCompare(b.তারিখ));
  return candidates[candidates.length-1];
}

function monthsBetween(startY, startM, endY, endM){
  const list = [];
  let y = startY, mo = startM;
  let guard = 0;
  while((y < endY || (y===endY && mo<=endM)) && guard < 1200){
    list.push({month:mo, year:y});
    mo++; if(mo>11){ mo=0; y++; }
    guard++;
  }
  return list;
}

function computeMemberDue(memberId, asOfIso){
  const m = members.find(x=>x.ID===memberId);
  if(!m) return null;
  const categories = {}; FEE_CATS.forEach(c=> categories[c.key]=0);
  const admission = m.তারিখ ? new Date(m.তারিখ+'T00:00:00') : null;
  const asOf = new Date(asOfIso+'T00:00:00');
  if(admission && !isNaN(admission) && admission<=asOf){
    const months = monthsBetween(admission.getFullYear(), admission.getMonth(), asOf.getFullYear(), asOf.getMonth());
    months.forEach(({month,year})=>{
      const fee = getApplicableFee(memberId, month, year);
      if(!fee) return;
      FEE_CATS.forEach(c=>{
        if(c.key==='খাবার_বিল') return;
        categories[c.key] += Number(fee[c.key])||0;
      });
      const foodVal = fee['খাবার_বিল'];
      if(foodVal!=='' && foodVal!=null && foodVal!==undefined){
        categories['খাবার_বিল'] += Number(foodVal)||0;
      } else {
        const totalMeals = allMembersMealsTotal(month,year);
        const expense = monthlyExpenseFor(month,year);
        const rate = totalMeals>0 ? expense/totalMeals : 0;
        const memberMeals = memberMealTotals(m.নাম, month, year).t;
        categories['খাবার_বিল'] += rate*memberMeals;
      }
    });
  }
  const totalOwed = FEE_CATS.reduce((s,c)=> s+categories[c.key], 0);
  const paidDeposits = deposits.filter(d=> d.সদস্য_আইডি===memberId && d.তারিখ && d.তারিখ<=asOfIso);
  const monthlyPaid = paidDeposits.reduce((s,d)=> s+(Number(d.ভাড়ার_পরিমাণ)||0), 0);
  const admissionPaid = paidDeposits.reduce((s,d)=> s+(Number(d.ভর্তি_ফি)||0), 0);
  const netDue = totalOwed - monthlyPaid;
  const catDue = {};
  FEE_CATS.forEach(c=>{
    const allocated = totalOwed>0 ? monthlyPaid*(categories[c.key]/totalOwed) : 0;
    catDue[c.key] = categories[c.key] - allocated;
  });
  return { member:m, categories, catDue, totalOwed, monthlyPaid, admissionPaid, netDue };
}

function buildMemberReport(memberId, asOfIso){
  const r = computeMemberDue(memberId, asOfIso);
  if(!r){ alert('সদস্য নির্বাচন করুন।'); return; }
  const m = r.member;
  const rows = FEE_CATS.map(c=>`<tr><td>${c.label}</td><td class="amount">${fmtMoney(r.categories[c.key])}</td><td class="amount">${fmtMoney(r.catDue[c.key])}</td></tr>`).join('');
  const statusLabel = r.netDue>=0 ? 'বকেয়া' : 'অগ্রিম';
  const statusAmount = Math.abs(r.netDue);
  const html = `
    <div class="official-print">
      <h2 class="serif">সদস্য হিসাব বিবরণী</h2>
      <div class="member-header">${avatarHtml(m,44)}<div><strong>${m.নাম}</strong><div class="muted">${m.মোবাইল} · ভর্তি: ${fmtDate(m.তারিখ)}</div></div></div>
      <div class="stmt-meta">হিসাবের তারিখ: ${fmtDate(asOfIso)}</div>
      <table>
        <tr><th>খাত</th><th>মোট পাওনা</th><th>বকেয়া/অগ্রিম</th></tr>
        ${rows}
        <tr><td><strong>সর্বমোট</strong></td><td class="amount"><strong>${fmtMoney(r.totalOwed)}</strong></td><td class="amount"><strong>${fmtMoney(r.netDue)}</strong></td></tr>
      </table>
      <p class="muted" style="margin-top:10px;">মোট পরিশোধ (মাসিক ফি বাবদ): ${fmtMoney(r.monthlyPaid)} · ভর্তি ফি পরিশোধ: ${fmtMoney(r.admissionPaid)}</p>
      <p><strong>সর্বমোট ${statusLabel}: ${fmtMoney(statusAmount)}</strong></p>
      <div class="sig-row"><div>সদস্যর স্বাক্ষর</div><div>কর্তৃপক্ষের স্বাক্ষর</div></div>
    </div>
  `;
  document.getElementById('reportResult').innerHTML = html + `<button class="ghost" id="printMemberReport" style="margin-top:14px;">প্রিন্ট করুন (অফিসিয়াল ফরমেট)</button>`;
  document.getElementById('printMemberReport').addEventListener('click', ()=> doPrint(html));
}

function buildAllReport(asOfIso){
  const results = members.map(m=> computeMemberDue(m.ID, asOfIso)).filter(Boolean);
  const tableRows = results.map(r=>{
    const statusLabel = r.netDue>=0 ? 'বকেয়া' : 'অগ্রিম';
    return `<tr><td>${avatarHtml(r.member)} ${r.member.নাম}</td><td class="amount">${fmtMoney(r.totalOwed)}</td><td class="amount">${fmtMoney(r.monthlyPaid)}</td><td class="amount">${fmtMoney(Math.abs(r.netDue))} (${statusLabel})</td></tr>`;
  }).join('');
  const totalOwedAll = results.reduce((s,r)=>s+r.totalOwed,0);
  const totalPaidAll = results.reduce((s,r)=>s+r.monthlyPaid,0);
  const html = `
    <div class="official-print">
      <h2 class="serif">সকল সদস্যের হিসাব বিবরণী</h2>
      <div class="stmt-meta">হিসাবের তারিখ: ${fmtDate(asOfIso)}</div>
      <table>
        <tr><th>সদস্য</th><th>মোট পাওনা</th><th>মোট পরিশোধ</th><th>বকেয়া/অগ্রিম</th></tr>
        ${tableRows || `<tr><td colspan="4">কোনো সদস্য নেই।</td></tr>`}
        <tr><td><strong>সর্বমোট</strong></td><td class="amount"><strong>${fmtMoney(totalOwedAll)}</strong></td><td class="amount"><strong>${fmtMoney(totalPaidAll)}</strong></td><td class="amount"><strong>${fmtMoney(totalOwedAll-totalPaidAll)}</strong></td></tr>
      </table>
    </div>
  `;
  document.getElementById('reportResult').innerHTML = html + `<button class="ghost" id="printAllReport" style="margin-top:14px;">প্রিন্ট করুন (অফিসিয়াল ফরমেট)</button>`;
  document.getElementById('printAllReport').addEventListener('click', ()=> doPrint(html));
}

loadAll();
</script>
</body>
</html>

<!--
======================= সেটআপ নির্দেশনা (বাংলা) =======================

এই অ্যাপটি এখন Google Sheet-কে ডাটাবেজ হিসেবে ব্যবহার করে, যাতে আপনি এটি GitHub-এ
আপলোড করে যেকোনো ব্রাউজার/ডিভাইস থেকে চালাতে পারেন। সেটআপ করতে নিচের ধাপগুলো অনুসরণ করুন:

১) একটি নতুন Google Sheet তৈরি করুন (sheets.google.com এ গিয়ে)।

২) মেনু থেকে Extensions > Apps Script এ ক্লিক করুন।

৩) যে কোড এডিটর খুলবে সেখানে ডিফল্ট কোড মুছে দিয়ে "Code.gs" ফাইলের সম্পূর্ণ কোড
   পেস্ট করুন (এই ফাইলটি আলাদাভাবে দেওয়া হয়েছে)।

৪) উপরে Save (ডিস্ক আইকন) চাপুন।

৫) Deploy > New deployment এ ক্লিক করুন।
   - Select type (গিয়ার আইকন) > Web app বেছে নিন।
   - Execute as: "Me" রাখুন।
   - Who has access: "Anyone" নির্বাচন করুন (এটা জরুরি, নাহলে অ্যাপ কাজ করবে না)।
   - Deploy বাটনে ক্লিক করুন। প্রথমবার একটা Authorize অনুমতি চাইবে, নিজের গুগল
     অ্যাকাউন্ট দিয়ে অনুমতি দিন।

৬) ডিপ্লয় হয়ে গেলে একটা "Web app URL" পাবেন, যেটা .../exec দিয়ে শেষ হয়। সেটা কপি করুন।

৭) এই HTML ফাইলে উপরের দিকে খুঁজুন:
      const CONFIG = { API_URL: "" };
   দুই কোটেশনের মাঝে আপনার কপি করা লিংকটি বসান, যেমন:
      const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycb.../exec" };

৮) ফাইলটি সেভ করে GitHub-এ আপলোড করুন (GitHub Pages চালু করলে একটা পাবলিক লিংক
   পাবেন, যেটা দিয়ে যেকোনো ডিভাইস থেকে অ্যাপটি চালানো যাবে)।

মনে রাখবেন: "Who has access: Anyone" মানে আপনার শীটের লিংক যার কাছে থাকবে সেই তথ্য
পড়তে/লিখতে পারবে, তাই লিংকটি শুধু বিশ্বস্ত মানুষের সাথে শেয়ার করুন।

কোনো ডেটা ভবিষ্যতে গুগল শীটে সরাসরি দেখতে চাইলে, একই স্প্রেডশিটে "Members",
"Deposits", "MealEntries", "MenuItems", "DailyMenu", "FeeSettings" ও
"MonthlyExpense" নামে সাতটি শীট (ট্যাব) অটোমেটিক তৈরি হয়ে যাবে যখন আপনি অ্যাপ
থেকে প্রথম ডেটা যোগ করবেন।

নতুন ফিচার যোগ করার পর আগের Code.gs আপডেট করে আবার Deploy > Manage deployments >
Edit (পেন্সিল আইকন) > New version দিয়ে পুনরায় ডিপ্লয় করতে ভুলবেন না, নাহলে
নতুন "ফি নির্ধারণ" ফিচার কাজ করবে না।

হিসাব সংক্রান্ত অনুমান: জমার ফরমে ভাড়া/গ্যাস/বিদ্যুৎ ইত্যাদি খাতভিত্তিক আলাদা
আলাদা পরিশোধের ঘর নেই — একটাই "মাসিক ভাড়ার পরিমাণ" ঘর আছে যেটাকে মোট মাসিক
পরিশোধ ধরে সব খাতের পাওনার সাথে অনুপাত হারে (proportionally) ভাগ করে খাতভিত্তিক
বকেয়া/অগ্রিম দেখানো হয়েছে। প্রতিটি খাতের জন্য আলাদা আলাদা পরিশোধ রেকর্ড রাখতে
চাইলে জমার ফরম আরও বিস্তারিতভাবে ঢেলে সাজাতে হবে — প্রয়োজন হলে জানাবেন।
-->
